name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test · wasm · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain, its components and the wasm target.
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy (WebAssembly)
        run: cargo clippy --locked -p nc-wallet-core -p nc-wallet-session -p nc-wallet-chain -p nc-wallet-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Build (WebAssembly, release profile)
        run: cargo build --locked -p nc-wallet-wasm --target wasm32-unknown-unknown --profile release-wasm

      - name: Docs
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
