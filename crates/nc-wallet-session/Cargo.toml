[package]
name = "nc-wallet-session"
description = "The state machine behind Nowcoin Omega's apps: the wallet being made, the backup quiz, sealing, the unlocked session, typed-phrase checks. Pure Rust, no I/O; shared by the Android bridge and the extension's WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nc-wallet-core = { workspace = true }
# Shuffling the backup quiz: the operating system's randomness, as in the core.
getrandom = { workspace = true }
zeroize = { workspace = true }
# Signing requests and what the approval screen shows arrive and leave as JSON.
serde_json = { workspace = true }
# The approval hash binds a decoded request to what is signed.
sha2 = { workspace = true }
# Solana transactions and messages travel as base64; its ids are base58.
base64 = { workspace = true }
bs58 = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Same as the core: on wasm32-unknown-unknown getrandom has no source of its
# own, and without this feature the build fails, which is the point.
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
hex = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
schnorrkel = { workspace = true }

[lints]
workspace = true
